schema_version: 1

context:
  name: azure-cli-core
  version: "2.90.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: aa5d336c3ede108570860c7edabcf54ad10cd1b00e9d4863c41759abf5977521

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - argcomplete >=3.5.2,<3.6
    - azure-cli-telemetry 1.1.0.*
    - azure-core >=1.39.0,<1.40
    - azure-mgmt-core >=1.2.0,<2
    - cryptography
    - distro
    - humanfriendly >=10.0,<11
    - jmespath
    - knack >=0.14.0,<0.15
    - microsoft-security-utilities-secret-masker >=1.0.0b4,<1.1.0
    - msal ==1.36.0
    - msal_extensions ==1.3.1
    - packaging >=20.9
    - pkginfo >=1.12.0
    - psutil >=5.9
    - py-deviceid
    - pyjwt >=2.1.0
    - pyopenssl >=17.1.0
    - pysocks >=1.6.0
    - requests >=2.20.0

tests:
  - python:
      imports:
        - azure
        - azure.cli
        - azure.cli.core
        - azure.cli.core.commands
        - azure.cli.core.extension
        - azure.cli.core.profiles
      python_version: ${{ python_min }}.*
about:
  license: MIT
  license_file: LICENSE
  summary: Microsoft Azure Command-Line Tools Core Module
  homepage: https://github.com/Azure/azure-cli
  repository: https://github.com/Azure/azure-cli
  documentation: https://docs.microsoft.com/en-us/cli/azure

extra:
  recipe-maintainers:
    - dhirschfeld
    - andreyz4k
    - janjagusch
